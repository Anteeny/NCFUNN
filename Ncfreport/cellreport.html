    .header-text p {

    .form-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 0.4rem;
      display: block;

    .form-input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(59, 130, 246,0.25);
      border-radius: 0.625rem;
      padding: 0.75rem 1rem;
      color: #e2e8f0;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      outline: none;
      appearance: none;
    }

    .form-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(59, 130, 246,0.15);
      background: rgba(255,255,255,0.09);
    }

    .form-input::placeholder { color: rgba(168,178,216,0.45); }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { opacity: 0.4; }

    /* Toggle */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(59, 130, 246,0.2);
      border-radius: 0.625rem;
      padding: 0.75rem 1rem;
    }

    .toggle-switch {
      position: relative;
      width: 52px;
      height: 28px;
      flex-shrink: 0;
    }

    .toggle-switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute; inset: 0;
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.3s;
      border: 1px solid rgba(59, 130, 246,0.3);
    }

    .slider::before {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      left: 3px; top: 3px;
      background: var(--soft);
      border-radius: 50%;
      transition: transform 0.3s, background 0.3s;
    }

    .toggle-switch input:checked + .slider {
      background: rgba(59, 130, 246,0.3);
      border-color: var(--gold);
    }

    .toggle-switch input:checked + .slider::before {
      transform: translateX(24px);
      background: var(--gold);

    .toggle-label {
      font-size: 0.95rem;
      color: #e2e8f0;
      user-select: none;

      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 0.2rem 0.7rem;
      border-radius: 999px;
      transition: all 0.3s;

    .status-yes {
      background: rgba(59, 130, 246,0.2);
      color: var(--gold-light);
      border: 1px solid rgba(59, 130, 246,0.4);
    }

    .status-no {
      background: rgba(168,178,216,0.1);
      color: var(--soft);
      border: 1px solid rgba(168,178,216,0.2);
    }

      border: none;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      opacity: 0.35;
      margin: 0.25rem 0;
    }

      padding: 0.9rem;
      border-radius: 0.75rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 50%, #3b82f6 100%);

      color: #090e1a;

      position: relative;
      overflow: hidden;
    }

    .submit-btn:hover {
      background-position: 100% 0;
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(59, 130, 246,0.45);
    }

    .submit-btn:active { transform: translateY(0); }

    .submit-btn.success {
      background: linear-gradient(135deg, #16a34a 0%, #22c55e 50%, #16a34a 100%) !important;
      box-shadow: 0 4px 24px rgba(34,197,94,0.4) !important;
      color: #fff !important;
      transform: translateY(0);
    }

    .submit-btn.success:hover {
      box-shadow: 0 6px 30px rgba(34,197,94,0.5) !important;
      transform: translateY(-1px);
    }

    /* Reset */
    .reset-btn {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.75rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      background: transparent;
      border: 1px solid rgba(168,178,216,0.25);
      color: var(--soft);
      transition: border-color 0.2s, color 0.2s;

    .reset-btn:hover {
      border-color: rgba(168,178,216,0.5);
      color: #e2e8f0;

    // Initialize immediately with fallback data so form is NEVER empty or blocked
    let cellLeadersList = [...FALLBACK_CELL_LEADERS];

    async function initCellLeadersData() {
      try {
        const { data, error } = await supabaseConnection
          .from('cell_leaders')
          .select('*');
        if (!error && data && data.length > 0) {
          cellLeadersList = data;
        }
      } catch (e) {
        console.warn("Supabase cell_leaders load note:", e);
      }
    }

    function normalizeAreaName(name) {
      if (!name) return '';
      const clean = name.trim();
      const lower = clean.toLowerCase();
      if (lower.includes('hostel')) return 'Hostel';
      if (lower.includes('hilltop')) return 'Hilltop';
      if (lower.includes('odim')) return 'Odim';
      if (lower.includes('odenigwe')) return 'Odenigwe';
      if (lower.includes('greenhouse')) return 'Greenhouse';
      if (lower.includes('jsq')) return 'JSQ';
      if (lower.includes('franco')) return 'Franco';
      if (lower.includes('hq')) return 'HQ';
      return clean;
    }

    function normalizeLeaderName(name) {
      if (!name) return '';
      const clean = name.replace(/^(Pastor|Bro|Sis|Deacon|Minister|Pst|Brother|Sister)\.?\s+/i, '');
      return clean.replace(/\s+/g, ' ').trim();
    }

    function handleZoneChange() {
      const selectedZone = (document.getElementById('zone-select')?.value || '').trim();
      const cellNameSelect = document.getElementById('cell-name-select');
      const leaderSelect = document.getElementById('leader-name-select');
      const addressInput = document.getElementById('cell-address');

      if (cellNameSelect) {
        cellNameSelect.innerHTML = '<option value="" disabled selected style="background:#0f172a; color:#94a3b8;">-- Select Area / Hostel --</option>';
      }
      if (leaderSelect) {
        leaderSelect.innerHTML = '<option value="" disabled selected style="background:#0f172a; color:#94a3b8;">-- Select Cell Leader --</option>';
      }
      if (addressInput) {
        addressInput.value = '';
      }

      if (!selectedZone) return;

      const matchingItems = cellLeadersList.filter(item => 
        (item.zone || '').trim().toLowerCase() === selectedZone.toLowerCase()
      );

      // Populate unique locations (Area / Hostel) for this zone
      const rawLocations = matchingItems.map(item => {
        const rawName = item.cell_name || item.name || item.location || item.cell_address;
        return normalizeAreaName(rawName);
      }).filter(Boolean);
      const locations = [...new Set(rawLocations)];

      locations.forEach(loc => {
        const opt = document.createElement('option');
        opt.value = loc;
        opt.textContent = loc;
        opt.style.background = '#1e293b';
        opt.style.color = '#f8fafc';
        cellNameSelect.appendChild(opt);
      });

      // Populate leaders for this zone
      const leaders = matchingItems.map(item => ({
        leader: item.cell_leader || item.leader || item.leader_name,
        address: item.cell_address || item.address || item.location,
        location: item.cell_name || item.name || item.location
      })).filter(item => item.leader);
      
      leaders.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.leader;
        opt.textContent = item.leader + (item.address ? ' (' + item.address + ')' : '');
        opt.style.background = '#1e293b';
        opt.style.color = '#f8fafc';
        leaderSelect.appendChild(opt);
      });
    }

    function handleLeaderChange() {
      const selectedZone = (document.getElementById('zone-select')?.value || '').trim();
      const selectedLeader = (document.getElementById('leader-name-select')?.value || '').trim();
      const cellNameSelect = document.getElementById('cell-name-select');
      const addressInput = document.getElementById('cell-address');

      if (!selectedLeader) return;

      // Log device to OneSignal under the leader's canonical lowercase name & prompt push
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        const canonical = normalizeLeaderName(selectedLeader).toLowerCase().trim();
        await OneSignal.login(canonical);
        await OneSignal.Slidedown.promptPush();
      });

      const match = cellLeadersList.find(item => 
        (item.zone || '').trim().toLowerCase() === selectedZone.toLowerCase() &&
        (item.cell_leader || item.leader || item.leader_name || '').trim().toLowerCase() === selectedLeader.toLowerCase()
      );

      if (match) {
        const locationVal = normalizeAreaName(match.cell_name || match.name || match.location);
        const addressVal = match.cell_address || match.address || match.location;
        if (locationVal && cellNameSelect) {
          let exists = false;
          for (let i = 0; i < cellNameSelect.options.length; i++) {
            if (cellNameSelect.options[i].value === locationVal) {
              exists = true;
              break;
            }
          }
          if (!exists) {
            const opt = document.createElement('option');
            opt.value = locationVal;
            opt.textContent = locationVal;
            cellNameSelect.appendChild(opt);
          }
          cellNameSelect.value = locationVal;
        }
        if (addressVal && addressInput) {
          addressInput.value = addressVal;
        }
      }
    }

    function handleCellNameChange() {
      const selectedZone = (document.getElementById('zone-select')?.value || '').trim();
      const selectedCellName = (document.getElementById('cell-name-select')?.value || '').trim();
      const leaderSelect = document.getElementById('leader-name-select');
      const addressInput = document.getElementById('cell-address');

      if (!selectedCellName) return;

      const matches = cellLeadersList.filter(item => 
        (item.zone || '').trim().toLowerCase() === selectedZone.toLowerCase() &&
        normalizeAreaName(item.cell_name || item.name || item.location || '').trim().toLowerCase() === selectedCellName.toLowerCase()
      );

      if (matches.length > 0) {
        if (matches.length === 1) {
          const match = matches[0];
          const leaderVal = match.cell_leader || match.leader;
          const addressVal = match.cell_address || match.address || match.location;
          if (leaderVal && leaderSelect) {
            leaderSelect.value = leaderVal;
          }
          if (addressVal && addressInput) {
            addressInput.value = addressVal;
          }
        } else {
          if (leaderSelect) {
            leaderSelect.innerHTML = '<option value="" disabled selected style="background:#0f172a; color:#94a3b8;">-- Select Cell Leader --</option>';
            matches.forEach(match => {
              const leaderVal = match.cell_leader || match.leader;
              const addressVal = match.cell_address || match.address || match.location;
              if (leaderVal) {
                const opt = document.createElement('option');
                opt.value = leaderVal;
                opt.textContent = leaderVal + (addressVal ? ' (' + addressVal + ')' : '');
                opt.style.background = '#1e293b';
                opt.style.color = '#f8fafc';
                leaderSelect.appendChild(opt);
              }
            });
          }
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initCellLeadersData();

    // 7. THE MAIN SUBMIT FUNCTION
   async function submitReport() {
    const zone = (document.getElementById('zone-select')?.value || '').trim();
    const cellName = (document.getElementById('cell-name-select')?.value || '').trim();
    const leader = (document.getElementById('leader-name-select')?.value || '').trim();
    const cellAddress = (document.getElementById('cell-address')?.value || '').trim();
    const timeIn = document.getElementById('time-in').value;
    const timeOut = document.getElementById('time-out').value;
    const attendance = document.getElementById('attendance').value;
    const converts = document.getElementById('converts').value;
    const offering = document.getElementById('offering').value;
    const refresh = document.getElementById('refreshments-toggle').checked;
    const notes = document.getElementById('report-notes').value.trim();

    const requiredFields = [
        { id: 'zone-select', value: zone, label: 'Zone' },
        { id: 'cell-name-select', value: cellName, label: 'Area / Hostel' },
        { id: 'leader-name-select', value: leader, label: 'Cell Leader' },
        { id: 'cell-address', value: cellAddress, label: 'Cell Address' },
        { id: 'time-in', value: timeIn, label: 'Time In' },
        { id: 'time-out', value: timeOut, label: 'Time Out' },
        { id: 'attendance', value: attendance, label: 'Attendance' },
        { id: 'converts', value: converts, label: 'New Converts' },
        { id: 'offering', value: offering, label: 'Offering' }
    ];

    for (let field of requiredFields) {
        if (!field.value || field.value === "") {
            const el = document.getElementById(field.id);
            if (el) {
              el.style.borderColor = '#06b6d4';
              el.focus();
            }
            alert(`Please fill in the ${field.label}. All fields are required.`);
            return; 
        }
    }

    const btn = document.querySelector('.submit-btn');
    btn.textContent = 'Submitting...';
    btn.disabled = true;

    try {
        const fullLocation = `${cellName} (${cellAddress})`;
        const { data, error } = await supabaseConnection
            .from('cell_reports')
            .insert([
                {
                    leader_name: leader,
                    location: fullLocation,
                    time_in: timeIn,
                    time_out: timeOut,
                    attendance: parseInt(attendance),
                    new_converts: parseInt(converts),
                    offering: parseFloat(offering),
                    refreshments: refresh,
                    notes: notes,
                    report_date: new Date().toISOString().split('T')[0]
                }
            ]);

        if (error) throw error;

        btn.classList.add('success');
        btn.textContent = '✓ Submitted';
        
        showSummary(leader, cellName, cellAddress, timeIn, timeOut, attendance, converts, offering, refresh, notes, zone);

    } catch (err) {
        console.error("Database Error:", err.message);
        alert("Error: " + err.message);
        btn.textContent = 'Submit Report';
    } finally {
        btn.disabled = false;
        setTimeout(() => {
            btn.classList.remove('success');
            btn.textContent = 'Submit Report';
        }, 3000);
    }
}
    function showSummary(leader, cellName, cellAddress, timeIn, timeOut, attend, converts, offering, refresh, notes, zone) {
        const rows = [
            { key: 'Zone', val: zone || '—' },
            { key: 'Cell Name', val: cellName || '—' },
            { key: 'Cell Leader', val: leader || '—' },
            { key: 'Cell Address', val: cellAddress || '—' },
            { key: 'Time In', val: formatTime(timeIn) },
            { key: 'Time Out', val: formatTime(timeOut) },
            { key: 'Attendance', val: attend },
            { key: 'New Converts', val: converts },
            { key: 'Offering', val: formatCurrency(offering) },
            { key: 'Refreshments', val: refresh ? 'Yes ✓' : 'No' },
        ];

        const body = document.getElementById('summary-body');
        body.innerHTML = rows.map(r => `
            <div class="summary-row">
                <span class="summary-key">${r.key}</span>
                <span class="summary-val">${r.val}</span>
            </div>
        `).join('');

        document.getElementById('summary-modal').classList.add('open');
    }

    function closeModal() {
        document.getElementById('summary-modal').classList.remove('open');
    }

    function resetForm() {
        if (document.getElementById('zone-select')) document.getElementById('zone-select').value = '';
        if (document.getElementById('cell-name-select')) document.getElementById('cell-name-select').value = '';
        if (document.getElementById('cell-name')) document.getElementById('cell-name').value = '';
        if (document.getElementById('leader-name-select')) document.getElementById('leader-name-select').value = '';
        if (document.getElementById('leader-name')) document.getElementById('leader-name').value = '';
        if (document.getElementById('cell-address')) document.getElementById('cell-address').value = '';
        if (document.getElementById('time-in')) document.getElementById('time-in').value = '';
        if (document.getElementById('time-out')) document.getElementById('time-out').value = '';
        if (document.getElementById('attendance')) document.getElementById('attendance').value = '';
        if (document.getElementById('converts')) document.getElementById('converts').value = '';
        if (document.getElementById('offering')) document.getElementById('offering').value = '';
        const toggle = document.getElementById('refreshments-toggle');
        if(toggle) toggle.checked = false;
        const statusLbl = document.getElementById('toggle-status');
        if(statusLbl) {
            statusLbl.textContent = 'No';
            statusLbl.className = 'status-no';
        }
    }

    // Close modal on backdrop click
    window.onclick = function(event) {
        const modal = document.getElementById('summary-modal');
        if (event.target == modal) closeModal();
    }
