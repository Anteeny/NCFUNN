<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NCF UNN — Unified Report Portal</title>
  <link rel="icon" type="image/png" href="images.png?v=3">
  <link rel="shortcut icon" type="image/x-icon" href="images.png?v=3">
  <link rel="apple-touch-icon" href="images.png?v=3">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/theme.css?v=4.0" />

  <style>
    /* ==========================================================================
       UNIFIED SINGLE HEADER DESIGN
       - PC View (>= 860px): Nav items centered directly in the main header
       - Mobile/Tablet (< 860px): 3-Line Hamburger Menu at right end of header
       ========================================================================== */

    /* Ambient Background Image */
    body::before {
      content: "";
      position: fixed;
      top: -20px; left: -20px; right: -20px; bottom: -20px;
      background: url('FYF.jpg') center center / cover no-repeat fixed, url('fyf.jpg') center center / cover no-repeat fixed;
      filter: blur(8px) brightness(0.35);
      z-index: -2;
    }

    .portal-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 14, 26, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(59, 130, 246, 0.25);
      padding: 0.55rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    /* Center Navigation (PC View) - Blends seamlessly with main header */
    .header-center-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      box-shadow: none !important;
    }

    .header-center-nav .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0.45rem 1rem;
      border-radius: 9999px;
      border: 1px solid transparent;
      background: transparent;
      color: #94a3b8;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
    }

    .header-center-nav .tab-btn:hover {
      color: #ffffff;
      background: rgba(59, 130, 246, 0.12);
      border-color: rgba(59, 130, 246, 0.25);
    }

    .header-center-nav .tab-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border-color: transparent;
      box-shadow: 0 3px 14px rgba(59, 130, 246, 0.45);
    }

    .header-center-nav .tab-icon {
      font-size: 0.95rem;
    }

    /* 3-Line Hamburger Navigation Button */
    .hamburger-nav-btn {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4.5px;
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: rgba(59, 130, 246, 0.12);
      border: 1.5px solid rgba(59, 130, 246, 0.35);
      cursor: pointer;
      padding: 7px;
      transition: all 0.2s ease;
      margin-left: auto;
      flex-shrink: 0;
    }

    .hamburger-nav-btn:hover, .hamburger-nav-btn.active {
      background: rgba(59, 130, 246, 0.25);
      border-color: #3b82f6;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
    }

    .hamburger-nav-btn .bar {
      width: 20px;
      height: 2px;
      background-color: #60a5fa;
      border-radius: 2px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .hamburger-nav-btn.active .bar:nth-child(1) {
      transform: translateY(6.5px) rotate(45deg);
    }
    .hamburger-nav-btn.active .bar:nth-child(2) {
      opacity: 0;
    }
    .hamburger-nav-btn.active .bar:nth-child(3) {
      transform: translateY(-6.5px) rotate(-45deg);
    }

    /* Mobile / Tablet Dropdown Menu */
    .mobile-nav-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 190;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }
    .mobile-nav-backdrop.show {
      display: block;
    }

    .mobile-nav-dropdown {
      display: none;
      position: fixed;
      top: 54px;
      right: 12px;
      width: min(290px, calc(100vw - 24px));
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      z-index: 200;
      flex-direction: column;
      gap: 4px;
      animation: menuSlideDown 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes menuSlideDown {
      from { opacity: 0; transform: translateY(-8px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .mobile-nav-dropdown.show {
      display: flex;
    }

    .mobile-menu-title {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      color: #60a5fa;
      padding: 6px 12px 6px 12px;
      border-bottom: 1px solid rgba(59, 130, 246, 0.15);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mobile-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      color: #94a3b8;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mobile-menu-item:hover {
      color: #ffffff;
      background: rgba(59, 130, 246, 0.12);
    }

    .mobile-menu-item.active {
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
    }

    .mobile-menu-item .item-icon {
      font-size: 1.15rem;
    }

    .mobile-menu-item .item-label {
      flex: 1;
    }

    .mobile-menu-item .item-badge {
      display: none;
      font-size: 0.65rem;
      padding: 2px 7px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .mobile-menu-item.active .item-badge {
      display: inline-block;
    }

    /* ==========================================================================
       HORIZONTALLY MOVING TICKER ALERT BANNER
       ========================================================================== */
    .pending-ticker-wrap {
      width: 100%;
      max-width: 960px;
      margin: 1.4rem auto 0.85rem auto !important; /* Generous breathing room below header card */
      padding: 0 0.75rem;
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(90deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 41, 59, 0.85) 50%, rgba(15, 23, 42, 0.95) 100%);
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-radius: 9999px;
      padding: 6px 14px 6px 6px;
      box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.55);
      overflow: hidden;
      position: relative;
    }

    .ticker-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: #ffffff;
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.45);
    }

    .ticker-pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
      animation: pulseDot 1.5s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.6; }
    }

    .ticker-track-container {
      flex: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      mask-image: linear-gradient(to right, transparent, black 16px, black calc(100% - 16px), transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 16px, black calc(100% - 16px), transparent);
    }

    .ticker-track {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      white-space: nowrap;
      animation: marqueeTicker 65s linear infinite;
      will-change: transform;
    }

    /* Pause horizontal marquee when user hovers or taps to click an item */
    .ticker-track-container:hover .ticker-track,
    .ticker-track:hover {
      animation-play-state: paused;
    }

    @keyframes marqueeTicker {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .pending-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 12px;
      background: rgba(59, 130, 246, 0.14);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #93c5fd;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .pending-badge:hover, .pending-badge:active {
      background: #2563eb;
      color: #ffffff;
      border-color: #3b82f6;
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(59, 130, 246, 0.4);
    }

    /* Screen Breakpoints */
    @media (max-width: 859px) {
      .header-center-nav {
        display: none !important;
      }
      .hamburger-nav-btn {
        display: flex !important;
      }
      .portal-date {
        display: none !important;
      }
      .pending-ticker-wrap {
        margin: 1.1rem auto 0.65rem auto !important;
        padding: 0 0.5rem;
      }
    }

    @media (min-width: 860px) {
      .header-center-nav {
        display: flex !important;
      }
      .hamburger-nav-btn {
        display: none !important;
      }
      .mobile-nav-dropdown {
        display: none !important;
      }
      .mobile-nav-backdrop {
        display: none !important;
      }
      .portal-date {
        display: block !important;
      }
    }
  </style>

  <!-- Supabase & Shared Modules -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="shared/supabase.js"></script>
  <script src="shared/leaders.js"></script>
</head>
<body>

  <!-- Unified Main Header Card -->
  <header class="portal-header">
    <!-- Left: Logo & Title -->
    <a href="index.html" class="portal-brand">
      <div class="portal-logo-wrap">
        <img src="images.png" alt="NCF Logo" />
      </div>
      <div class="portal-title-wrap">
        <h1>New Covenant Family, UNN</h1>
        <p>Reporting Portal</p>
      </div>
    </a>

    <!-- Center: Navigation Items in Header (PC View) -->
    <nav class="header-center-nav" id="header-center-nav" role="tablist">
      <button class="tab-btn active" data-tab="g12" role="tab">
        <span class="tab-icon">📋</span>
        <span>G12</span>
      </button>
      <button class="tab-btn" data-tab="dept" role="tab">
        <span class="tab-icon">🏛️</span>
        <span>Department</span>
      </button>
      <button class="tab-btn" data-tab="connect" role="tab">
        <span class="tab-icon">🔗</span>
        <span>Connect</span>
      </button>
      <button class="tab-btn" data-tab="service" role="tab">
        <span class="tab-icon">⛪</span>
        <span>Service</span>
      </button>
      <button class="tab-btn" data-tab="mvp" role="tab">
        <span class="tab-icon">🌟</span>
        <span>MVP</span>
      </button>
    </nav>

    <!-- Right: Date (PC) & 3-Line Menu (Mobile/Tablet) -->
    <div class="portal-header-meta">
      <div class="portal-date" id="portal-live-date"></div>

      <button class="hamburger-nav-btn" id="hamburger-btn" aria-label="Toggle navigation menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>
  </header>

  <!-- Mobile / Tablet Dropdown Menu -->
  <div class="mobile-nav-backdrop" id="mobile-nav-backdrop"></div>
  <div class="mobile-nav-dropdown" id="mobile-nav-dropdown">
    <div class="mobile-menu-title">
      <span>Navigation</span>
      <span style="font-size:0.65rem; color:#94a3b8;">Tap to switch</span>
    </div>
    <button class="mobile-menu-item active" data-tab="g12">
      <span class="item-icon">📋</span>
      <span class="item-label">G12 Report</span>
      <span class="item-badge">Active</span>
    </button>
    <button class="mobile-menu-item" data-tab="dept">
      <span class="item-icon">🏛️</span>
      <span class="item-label">Departmental Report</span>
      <span class="item-badge">Active</span>
    </button>
    <button class="mobile-menu-item" data-tab="connect">
      <span class="item-icon">🔗</span>
      <span class="item-label">Connect Group</span>
      <span class="item-badge">Active</span>
    </button>
    <button class="mobile-menu-item" data-tab="service">
      <span class="item-icon">⛪</span>
      <span class="item-label">Service Attendance</span>
      <span class="item-badge">Active</span>
    </button>
    <button class="mobile-menu-item" data-tab="mvp">
      <span class="item-icon">🌟</span>
      <span class="item-label">MVP Tracker</span>
      <span class="item-badge">Active</span>
    </button>
  </div>

  <!-- Dynamic Horizontally Moving Alert Banner -->
  <div class="pending-ticker-wrap" id="pending-alert-container" style="display:none;">
    <div class="ticker-badge" id="ticker-badge">
      <span class="ticker-pulse-dot"></span>
      <span id="pending-alert-title-text">Pending G12</span>
    </div>
    
    <div class="ticker-track-container" id="ticker-container" title="Hover to pause ticker">
      <div class="ticker-track" id="pending-leaders-list">
        <!-- Dynamically populated moving badges -->
      </div>
    </div>
  </div>

  <!-- Main Viewport Hosting Active Tab -->
  <main class="portal-viewport-wrap">
    <iframe 
      id="portal-tab-frame" 
      class="portal-frame" 
      src="tabs/g12.html" 
      frameborder="0"
      scrolling="no"
      title="NCF Report Submission Form">
    </iframe>
  </main>

  <footer style="text-align: center; padding: 1.25rem 0.5rem; color: #64748b; font-size: 0.75rem; border-top: 1px solid rgba(59, 130, 246, 0.15);">
    &copy; New Covenant Family, UNN &bull; All Reporting Systems Active
  </footer>

  <script>
    // Live date display
    const now = new Date();
    document.getElementById('portal-live-date').textContent = now.toLocaleDateString('en-GB', {
      weekday: 'short',
      day: 'numeric',
      month: 'short'
    });

    const TAB_MAP = {
      g12: 'tabs/g12.html',
      dept: 'tabs/dept.html',
      connect: 'tabs/connect.html',
      service: 'tabs/service.html',
      mvp: 'tabs/mvp.html'
    };

    const frame = document.getElementById('portal-tab-frame');
    const tabButtons = document.querySelectorAll('.header-center-nav .tab-btn');
    const mobileMenuItems = document.querySelectorAll('.mobile-menu-item');
    const hamburgerBtn = document.getElementById('hamburger-btn');
    const mobileDropdown = document.getElementById('mobile-nav-dropdown');
    const mobileBackdrop = document.getElementById('mobile-nav-backdrop');

    let currentActiveTab = 'g12';

    // Auto-resize iframe height
    function resizeFrame() {
      try {
        if (frame.contentWindow && frame.contentWindow.document.body) {
          const newHeight = frame.contentWindow.document.body.scrollHeight + 60;
          frame.style.height = Math.max(newHeight, 780) + 'px';
        }
      } catch (e) {
        frame.style.height = '1100px';
      }
    }

    frame.addEventListener('load', () => {
      resizeFrame();
      setTimeout(resizeFrame, 400);
      setTimeout(resizeFrame, 1200);
    });

    window.addEventListener('resize', resizeFrame);

    // Mobile Hamburger Menu Toggles
    function toggleMobileMenu() {
      const isOpen = mobileDropdown.classList.contains('show');
      if (isOpen) {
        closeMobileMenu();
      } else {
        openMobileMenu();
      }
    }

    function openMobileMenu() {
      mobileDropdown.classList.add('show');
      mobileBackdrop.classList.add('show');
      hamburgerBtn.classList.add('active');
    }

    function closeMobileMenu() {
      mobileDropdown.classList.remove('show');
      mobileBackdrop.classList.remove('show');
      hamburgerBtn.classList.remove('active');
    }

    if (hamburgerBtn) {
      hamburgerBtn.addEventListener('click', toggleMobileMenu);
    }
    if (mobileBackdrop) {
      mobileBackdrop.addEventListener('click', closeMobileMenu);
    }

    // Switch Tab Handler
    function switchTab(tabId, extraParams = '') {
      if (!TAB_MAP[tabId]) tabId = 'g12';
      currentActiveTab = tabId;

      // Update Desktop Header Tab Buttons
      tabButtons.forEach(btn => {
        if (btn.getAttribute('data-tab') === tabId) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      // Update Mobile Dropdown Menu Items
      mobileMenuItems.forEach(item => {
        if (item.getAttribute('data-tab') === tabId) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });

      // Close mobile menu if open
      closeMobileMenu();

      // Update URL query parameter without reload
      const currentUrl = new URL(window.location);
      currentUrl.searchParams.set('tab', tabId);
      window.history.replaceState({}, '', currentUrl);

      // Build target src with any query parameters
      let targetSrc = TAB_MAP[tabId];
      const params = new URLSearchParams(window.location.search);
      if (extraParams) {
        const extraObj = new URLSearchParams(extraParams);
        extraObj.forEach((val, key) => params.set(key, val));
      }
      
      const queryStr = params.toString();
      if (queryStr) {
        targetSrc += '?' + queryStr;
      }

      // Smooth switch
      frame.style.opacity = '0.6';
      frame.src = targetSrc;
      frame.onload = () => {
        frame.style.opacity = '1';
        resizeFrame();
      };

      // Dynamically update the pending alert for this specific tab
      updatePendingAlertForTab(tabId);
    }

    // Attach click listeners to desktop header tabs
    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.getAttribute('data-tab');
        switchTab(tab);
      });
    });

    // Attach click listeners to mobile menu items
    mobileMenuItems.forEach(item => {
      item.addEventListener('click', () => {
        const tab = item.getAttribute('data-tab');
        switchTab(tab);
      });
    });

    // In-memory cache for pending alert data
    let cachedG12Pending = null;
    let cachedDeptPending = null;

    async function updatePendingAlertForTab(tabId) {
      const container = document.getElementById('pending-alert-container');
      const titleEl = document.getElementById('pending-alert-title-text');
      const descEl = document.getElementById('pending-alert-desc-text');
      const listEl = document.getElementById('pending-leaders-list');

      // If tab is NOT g12 or dept, immediately hide the alert
      if (tabId !== 'g12' && tabId !== 'dept') {
        container.style.display = 'none';
        return;
      }

      const client = getSupabaseClient();
      if (!client) {
        container.style.display = 'none';
        return;
      }

      const todayStr = new Date().toISOString().split('T')[0];

      // Handle G12 Tab Pending Reports
      if (tabId === 'g12') {
        if (cachedG12Pending === null) {
          try {
            const [membersRes, reportsRes] = await Promise.all([
              client.from('members').select('member_name, g12_leader, leader_type'),
              client.from('g12_reports').select('leader_name, report_date').eq('report_date', todayStr)
            ]);

            if (membersRes.error || reportsRes.error) {
              container.style.display = 'none';
              return;
            }

            const submittedLeaders = new Set((reportsRes.data || []).map(r => normalizeLeaderName(r.leader_name).toLowerCase()));
            const allG12Leaders = new Set();
            (membersRes.data || []).forEach(m => {
              if (m.g12_leader && m.g12_leader.trim() && m.g12_leader.toLowerCase() !== 'unassigned') {
                allG12Leaders.add(normalizeLeaderName(m.g12_leader));
              }
            });

            cachedG12Pending = Array.from(allG12Leaders).filter(l => !submittedLeaders.has(l.toLowerCase())).sort();
          } catch (e) {
            cachedG12Pending = [];
          }
        }

        if (cachedG12Pending && cachedG12Pending.length > 0) {
          titleEl.textContent = 'Pending G12';
          listEl.innerHTML = '';

          const createG12Badge = (name) => {
            const badge = document.createElement('button');
            badge.className = 'pending-badge';
            badge.innerHTML = `<span>⏳</span><span>${name}</span>`;
            badge.onclick = () => {
              switchTab('g12', `leader=${encodeURIComponent(name)}`);
            };
            return badge;
          };

          // Append items twice to create a seamless infinite loop animation
          cachedG12Pending.forEach(name => listEl.appendChild(createG12Badge(name)));
          cachedG12Pending.forEach(name => listEl.appendChild(createG12Badge(name)));

          container.style.display = 'flex';
        } else {
          container.style.display = 'none';
        }
        return;
      }

      // Handle Department Tab Pending Reports
      if (tabId === 'dept') {
        if (cachedDeptPending === null) {
          try {
            const [deptLeadersRes, deptReportsRes] = await Promise.all([
              client.from('department_leaders').select('department_name, leader_name'),
              client.from('dept_reports').select('dept_name, report_date').eq('report_date', todayStr)
            ]);

            const submittedDepts = new Set((deptReportsRes.data || []).map(r => (r.dept_name || '').toLowerCase().trim()));
            let allDepts = [];

            if (deptLeadersRes.data && deptLeadersRes.data.length > 0) {
              allDepts = deptLeadersRes.data.map(d => d.department_name);
            } else {
              allDepts = ["Media Unit", "T.Crew", "Ushering", "NCF Angels", "Intercessory Team", "MVP", "Admin", "Technical Unit", "Greeters", "Evangelism", "Deep Oasis", "Temple tenders"];
            }

            cachedDeptPending = allDepts.filter(dept => !submittedDepts.has(dept.toLowerCase().trim())).sort();
          } catch (e) {
            cachedDeptPending = [];
          }
        }

        if (cachedDeptPending && cachedDeptPending.length > 0) {
          titleEl.textContent = 'Pending Depts';
          listEl.innerHTML = '';

          const createDeptBadge = (dept) => {
            const badge = document.createElement('button');
            badge.className = 'pending-badge';
            badge.innerHTML = `<span>🏛️</span><span>${dept}</span>`;
            badge.onclick = () => {
              switchTab('dept', `dept=${encodeURIComponent(dept)}`);
            };
            return badge;
          };

          // Append items twice to create a seamless infinite loop animation
          cachedDeptPending.forEach(dept => listEl.appendChild(createDeptBadge(dept)));
          cachedDeptPending.forEach(dept => listEl.appendChild(createDeptBadge(dept)));

          container.style.display = 'flex';
        } else {
          container.style.display = 'none';
        }
        return;
      }
    }

    // Check URL parameters on initial load
    const initialParams = new URLSearchParams(window.location.search);
    const requestedTab = initialParams.get('tab') || 'g12';
    switchTab(requestedTab);
  </script>
</body>
</html>
